server {
    listen 80;
    listen [::]:80;
    server_name mood-interior.ru;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mood-interior.ru;

    ssl_certificate /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Keep Next.js admin proxy routes to preserve cookie-based auth flow.
    location /api/admin/ {
        proxy_pass http://frontend:3000;
    }

    # Legacy Next.js alias route still served by frontend.
    location = /api/portfolio-feedback {
        proxy_pass http://frontend:3000;
    }

    # Public backend API exposed behind /api/*.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
    }

    # Backend static assets (uploaded images).
    location /static/ {
        proxy_pass http://backend:8000;
    }

    # All frontend pages and assets.
    location / {
        proxy_pass http://frontend:3000;
    }
}
