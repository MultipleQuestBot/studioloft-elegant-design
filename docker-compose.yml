version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_PATH_BACKEND: https://your-domain.com/api
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_SITE_URL: https://your-domain.com
      NODE_ENV: production
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      CORS_ORIGINS: https://your-domain.com
      DEBUG: "false"
      LOG_LEVEL: INFO
    volumes:
      - backend_data:/app/data
      - backend_static:/app/app/static
    restart: unless-stopped
    networks:
      - app_net

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    restart: unless-stopped
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  backend_data:
  backend_static:
  letsencrypt:
  certbot_www:
